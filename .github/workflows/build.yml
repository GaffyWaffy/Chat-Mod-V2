name: Build mod

# Runs on every push to main, and lets you trigger it by hand from the Actions tab.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
          # caches Minecraft + Loom downloads so later builds take ~1 min instead of ~5
          cache-read-only: false

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chatwindows-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Only runs when you push a tag like v1.0.0 — creates a permanent download link.
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
